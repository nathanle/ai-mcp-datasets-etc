[package]
name = "rust-mcp-search"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "3.2.0", features = ["server", "transport-io", "macros"] }          # Note: version may vary; use the latest
rmcp-macros = "3.2.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dotenvy = "0.15"         # To load API key from .env file
